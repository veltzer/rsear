[package]
name = "rsear"
version = "0.1.9"
edition = "2024"
authors = ["Mark Veltzer <mark.veltzer@gmail.com>"]
description = "Train your ears"
license = "MIT"
repository = "https://github.com/veltzer/rsear"

[dependencies]
fluidlite = "0.2"
rodio = "0.19"
eframe = "0.36"

# fluidlite-sys ships prebuilt bindings for every target the release job
# builds except aarch64-apple-darwin (it predates Apple silicon), and its
# build script panics with "No prebuilt bindings" there. On that target
# alone the bindings are generated at build time through bindgen, which
# uses the libclang that Xcode provides on the macOS runner. Everywhere
# else the prebuilt bindings stay in use, so no other build grows a
# libclang requirement. The generated bindings are the same as the
# prebuilt ones: the x86_64-macos and aarch64-linux files in the crate are
# byte-identical, the API has no architecture-specific types.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
fluidlite = { version = "0.2", features = ["bindgen"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
