[package]
name = "rsear"
version = "0.1.11"
edition = "2024"
authors = ["Mark Veltzer <mark.veltzer@gmail.com>"]
description = "Train your ears"
license = "MIT"
repository = "https://github.com/veltzer/rsear"

[dependencies]
fluidlite = "0.2"
rodio = "0.19"
eframe = "0.36"

# macOS (darwin) binaries are no longer built or released, so the
# aarch64-apple-darwin override below is disabled. Uncomment it together
# with the darwin entries in .github/workflows/ci.yml to bring them back.
#
# fluidlite-sys ships prebuilt bindings for every target the release job
# builds except aarch64-apple-darwin (it predates Apple silicon), and its
# build script panics with "No prebuilt bindings" there. On that target
# alone the bindings are generated at build time through bindgen, which
# uses the libclang that Xcode provides on the macOS runner. Everywhere
# else the prebuilt bindings stay in use, so no other build grows a
# libclang requirement. The generated bindings are the same as the
# prebuilt ones: the x86_64-macos and aarch64-linux files in the crate are
# byte-identical, the API has no architecture-specific types.
# [target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# fluidlite = { version = "0.2", features = ["bindgen"] }

# Dev builds favour compile speed: line tables keep file:line in backtraces
# at a fraction of full debug info's link cost, and dependencies get light
# optimization once (they rarely change) so tests run faster.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# Everyday release builds: thin LTO keeps most of the gain while using every
# core. The fully optimized binary is the dist profile below.
[profile.release]
strip = true
lto = "thin"

# What ships: CI's release job builds this (`cargo build --profile dist`).
# Fat LTO with one codegen unit is slow to build and only worth it here.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

# The fleet's lint table, the same in every rs* crate. rustc's own warnings
# are errors in every build, not only in the gate. clippy's default lints are
# errors too, and its pedantic and nursery groups are on: the gate runs
# clippy with -D warnings, so each of those fails the build as well.
[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
